server {
    listen 8080;
    root /usr/share/nginx/html;

    # Publishing already wrote a .gz next to each file; send that instead of compressing again.
    gzip_static on;

    # Revalidate on every visit, so a new deployment is picked up at once.
    add_header Cache-Control "no-cache";

    # These file names contain a hash of their content, so they never change.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Settings can be replaced per environment by mounting another file, which the published .gz
    # wouldn't reflect.
    location = /appsettings.json {
        gzip_static off;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "Healthy";
    }

    # Page addresses exist only inside the app, so any unknown path gets index.html.
    location / {
        try_files $uri /index.html;
    }
}
