# Local development infrastructure. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: messenger-postgres
    environment:
      # Local development credentials only.
      POSTGRES_DB: messenger_messages
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger_messages"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Job storage for the Identity service's Hangfire background jobs.
  redis:
    image: redis:8
    container_name: messenger-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Message broker between the services (stage 06). Management UI: http://localhost:15672 (guest/guest).
  rabbitmq:
    image: rabbitmq:4-management
    container_name: messenger-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Collects traces from both services over OTLP and shows them (stage 06). UI: http://localhost:16686.
  # Traces are kept in memory only, so they're gone after a restart.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    container_name: messenger-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP over gRPC (what the services send to)
      - "4318:4318"     # OTLP over HTTP

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
